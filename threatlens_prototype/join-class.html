<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Class | ThreatLens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-shell">
    <a class="brand auth-brand" href="dashboard.html"><span class="brand-icon">🛡️</span> ThreatLens</a>
    <div class="auth-card wide">
      <div class="section-heading center"><span class="eyebrow">CLASSROOM MODE</span><h1>Join a class</h1><p>Enter the code shared by your teacher. You can also keep learning independently.</p></div>
      <form id="classForm">
        <label class="form-label">Class code
          <input id="classCode" type="text" placeholder="e.g. CSE2A-7K42" required>
        </label>
        <button class="btn full" type="submit">Join Class →</button>
      </form>
      <div id="classSuccess" class="success-panel hidden">
        <div class="success-icon">✓</div>
        <h2>You've joined the class!</h2>
        <p id="classDetails">ABC Engineering College • CSE • 2nd Year • Section A</p>
        <a href="dashboard.html" class="btn">Go to Dashboard →</a>
      </div>
      <div class="demo-code"><b>Use the code generated by your teacher.</b> Each class has its own code.</div>
    </div>
  </div>
  <script src="app.js"></script><script>if(!requireRole('student')){}</script>
</body>
</html>
